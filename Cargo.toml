[package]
name = "monitor-hub"
version = "2.0.1"
edition = "2021"
license = "MIT"
description = "Lightweight server monitoring hub"
repository = "https://github.com/monitor-probe/monitor"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# "multipart": 插件上传(R11)接收 multipart/form-data 的 tar.gz。
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
futures-core = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["limit", "compression-gzip"] }
# Theme archives. Both are pure Rust: the release binary is built with `cross`
# and the image is FROM scratch, which rules out a C dependency or an external
# tar.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# 插件运行时。编译期裁剪:wasmtime 默认 features 会拉入 wasi、component-model、
# gc、cache、profiling 等一大批 v1 用不到的东西;`cranelift`(编译 wasm 到本机码,
# 含 fuel metering 支持)+ `runtime`(Store/Linker/调用机制)+ `std` + `anyhow`
# (`wasmtime::Error` 到 `anyhow::Error` 的转换,不然错误无法穿过 `Result<T>`)
# 是一个能跑纯核心 wasm 模块的最小集合。版本取 48.x:crates.io 上最新稳定版
# (49 还在 rc)。
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
# 插件 manifest(TOML)解析。默认 features 已含 serde 支持。
toml = "1"
# 插件宿主契约:13 个宿主函数的唯一实现在这个独立 crate 里(插件仓 release 时
# 也能 link 它跑真宿主 instantiate)。本 crate 只实现它的 trait,不反向依赖。
monitor-plugin-contract = { path = "crates/monitor-plugin-contract" }

[dev-dependencies]
serde_urlencoded = "0.7"
# Only the tests need a movable clock; the relay deadline spans minutes.
# dev-dependencies do not reach the shipped binary.
tokio = { version = "1", features = ["test-util"] }
# 插件测试需要用 WAT 文本现场编译 wasm fixture;dev-dependencies 不进发布产物。
wat = "1"
# 插件上传测试要经 router 整调(oneshot),验证 main 的分层挂载;
# dev-dependencies 不进发布产物。
tower = { version = "0.5", features = ["util"] }

# members 不含 ".":根包由它自己的 [package] 声明,workspace 根包自带成员资格,
# 列进去反而会与 [package] 重复声明。default-members 因此是根包,cargo build /
# cargo test 在仓根的行为与没有 workspace 时一致。
[workspace]
members = ["crates/monitor-plugin-contract"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
