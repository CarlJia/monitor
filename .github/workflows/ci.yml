name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # rust-embed requires the panel's dist/ to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web-admin

      # 布局抖动预算：逐条后台路由量 dist/ 产物的 CLS，超过阈值即失败。量的是
      # 构建产物，所以排在 build 之后。用 runner 自带的 Chrome（ubuntu 镜像已装），
      # 不为它引入额外的 action。
      - run: npm run cls-budget
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 根 crate 拖进了 wasmtime 48 和 bundled 的 rusqlite，冷编译一次要几分钟，
      # 而 clippy 与三次 test 各要编一遍。三个 crate 彼此独立（根 package 没有
      # [workspace]），所以逐个列出各自缓存 target/；Cargo.lock 不变时命中，之后
      # 只有改动的 crate 会重编。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/tg-notify -> target
            plugins/finance-stats -> target

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than left to build.rs so the
      # download happens on the runner: release builds go through cross, whose
      # container does not necessarily carry curl. 排在缓存恢复之后：theme 解包在
      # target/theme，先解包再恢复会被缓存里与 pin 不符的旧 theme 覆盖。
      - run: ./scripts/theme.sh

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # 插件是独立 crate(不在根 workspace 里),上面那条 `cargo test` 不会覆盖
      # 它们——而它们正是宿主到期/财务行为的替代覆盖所在。冒烟测试会嵌套构建
      # wasm32 产物,所以目标也要装。
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test
        working-directory: plugins/tg-notify
      - run: cargo test
        working-directory: plugins/finance-stats
