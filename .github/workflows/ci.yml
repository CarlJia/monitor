name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # rust-embed requires the panel's dist/ to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web-admin

      # 布局抖动预算：逐条后台路由量 dist/ 产物的 CLS，超过阈值即失败。量的是
      # 构建产物，所以排在 build 之后。用 runner 自带的 Chrome（ubuntu 镜像已装），
      # 不为它引入额外的 action。
      - run: npm run cls-budget
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 根 crate 拖进了 wasmtime 48 和 bundled 的 rusqlite，冷编译一次要几分钟，
      # 而 clippy 与 test 各要编一遍。缓存依赖后只重编改动部分。
      - uses: Swatinem/rust-cache@v2

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than left to build.rs so the
      # download happens on the runner: release builds go through cross, whose
      # container does not necessarily carry curl. 排在缓存恢复之后：theme 解包在
      # target/theme，先解包再恢复会被缓存里与 pin 不符的旧 theme 覆盖。
      - run: ./scripts/theme.sh

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The monitor-plugin-contract crate is a workspace member but NOT a default
  # member, so the `check` job's `cargo test` above does not cover it. This job
  # tests it and enforces the one invariant that can't live inside the crate
  # itself (the crate is vendored by plugin repos, where monitor's manifest.rs
  # doesn't exist): the crate's major version must equal the host's ABI_VERSION,
  # so a host ABI bump and a contract release can never drift apart.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version sync (contract major == ABI_VERSION; crate ABI == host ABI)
        run: |
          abi=$(grep -oE 'pub const ABI_VERSION: i64 = [0-9]+' src/plugin/manifest.rs | grep -oE '[0-9]+$')
          test -n "$abi" || { echo "::error::could not read host ABI_VERSION"; exit 1; }
          cv=$(grep -m1 '^version' crates/monitor-plugin-contract/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | cut -d. -f1)
          cabi=$(grep -oE 'pub const ABI_VERSION: i64 = [0-9]+' crates/monitor-plugin-contract/src/constants.rs | grep -oE '[0-9]+$')
          test -n "$cv" || { echo "::error::could not read contract version"; exit 1; }
          test -n "$cabi" || { echo "::error::could not read the crate's ABI_VERSION const"; exit 1; }
          fail=0
          [ "$cv" = "$abi" ]   || { echo "::error::contract major ($cv) != host ABI_VERSION ($abi) — bump crates/monitor-plugin-contract/Cargo.toml with the ABI change"; fail=1; }
          [ "$cabi" = "$abi" ] || { echo "::error::crate ABI_VERSION ($cabi) != host ABI_VERSION ($abi) — they must stay equal or plugin releases validate the wrong host"; fail=1; }
          [ $fail -eq 0 ] && echo "OK: contract major $cv == crate ABI $cabi == host ABI $abi"
          exit $fail
      - run: cargo test -p monitor-plugin-contract
      # The `check` job's clippy uses --all-targets on the default members only,
      # so it does not cover this crate; lint it here.
      - run: cargo clippy -p monitor-plugin-contract --all-targets -- -D warnings

  # Plugin sources moved to CarlJia/monitor-hub-plugins, so a host-side ABI
  # change here (ABI_VERSION bump, or a plugin_id rename on the far side) no
  # longer shows up in this repo's tests — it would merge green and break the
  # published plugins. This gate restores the producer-side signal without a
  # token: it reads THIS PR's ABI_VERSION and compares it against every
  # published plugin's declared abi_version, and pins the one plugin_id this
  # repo hard-depends on (the finance plugin gates an irreversible column-drop
  # migration in src/db.rs). A coordinated ABI bump must land the plugin repo
  # update first, or this job stays red until it does — that is the intended
  # coupling, not a flake.
  plugin-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check published plugins against this PR's ABI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abi=$(grep -oE 'pub const ABI_VERSION: i64 = [0-9]+' src/plugin/manifest.rs | grep -oE '[0-9]+$')
          test -n "$abi" || { echo "::error::could not read ABI_VERSION from src/plugin/manifest.rs"; exit 1; }
          echo "this PR's ABI_VERSION: $abi"
          fail=0

          # Fetch one file from the plugin repo. Distinguish a real 404 (dir has
          # no plugin.toml -> legitimate skip) from any other failure (transient
          # gh/network error -> fail closed, never a silent skip).
          fetch() { # $1 = repo path; prints decoded content, returns 0/404-as-2/other-as-1
            local out rc
            out=$(gh api "repos/CarlJia/monitor-hub-plugins/contents/$1" --jq .content 2>/tmp/gherr); rc=$?
            if [ $rc -eq 0 ]; then printf '%s' "$out" | base64 -d; return 0; fi
            grep -qi 'Not Found\|404' /tmp/gherr && return 2
            echo "::error::gh api failed for $1: $(tr -d '\n' </tmp/gherr)" >&2; return 1
          }

          # Roster derived from the plugin repo's top-level plugin dirs.
          plugins=$(gh api repos/CarlJia/monitor-hub-plugins/contents --jq '.[] | select(.type=="dir") | .name')
          test -n "$plugins" || { echo "::error::could not list plugin repo contents"; exit 1; }
          for p in $plugins; do
            # `if` guards the command substitution so a non-zero fetch return
            # does not trip `set -e` before rc is captured.
            if toml=$(fetch "$p/plugin.toml"); then rc=0; else rc=$?; fi
            [ $rc -eq 2 ] && continue                 # no plugin.toml -> not a plugin dir
            [ $rc -eq 0 ] || { fail=1; continue; }     # transient error -> fail closed
            declared=$(printf '%s' "$toml" | grep -oE '^abi_version *= *[0-9]+' | grep -oE '[0-9]+$' || true)
            if [ -z "$declared" ]; then
              echo "::error::published plugin $p has no numeric abi_version"; fail=1
            elif [ "$declared" != "$abi" ]; then
              echo "::error::published plugin $p declares abi_version=$declared, this PR sets ABI_VERSION=$abi — bump the plugin repo first"
              fail=1
            else
              echo "$p: abi_version=$declared OK"
            fi
          done

          # The finance plugin_id gates the irreversible v6 column-drop in src/db.rs.
          # Both anchors fail CLOSED: an unreadable local constant or an unfetchable
          # remote manifest is an error, not a pass.
          want=$(grep -oE 'FINANCE_PLUGIN_ID: &str = "[^"]+"' src/db.rs | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$want" || { echo "::error file=src/db.rs::could not read FINANCE_PLUGIN_ID from src/db.rs"; exit 1; }
          if fintoml=$(fetch "finance-stats/plugin.toml"); then :; else
            echo "::error::could not fetch finance-stats/plugin.toml to verify plugin_id"; exit 1
          fi
          fin=$(printf '%s' "$fintoml" | grep -oE '^plugin_id *= *"[^"]+"' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$fin" != "$want" ]; then
            echo "::error file=src/db.rs::finance plugin_id drift: plugin repo has '$fin', src/db.rs FINANCE_PLUGIN_ID is '$want' — the v6 migration gate would silently never complete"
            fail=1
          else
            echo "finance plugin_id: $fin OK"
          fi
          exit $fail
